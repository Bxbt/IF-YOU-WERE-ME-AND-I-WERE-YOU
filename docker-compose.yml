# Phase 3C Live (docs/10 §10.3) — deploy as a Portainer stack.
# Set in Portainer → Stack → Environment variables:
#   POSTGRES_PASSWORD         any long random string
#   CLOUDFLARE_TUNNEL_TOKEN   from Cloudflare Zero Trust → Networks → Tunnels (public hostname → http://app:8080)
# Without a tunnel: remove the `tunnel` service and publish app's port instead (put Cloudflare proxy in front).
services:
  app:
    build: .
    image: if-you-were-me:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://game:${POSTGRES_PASSWORD}@db:5432/game
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    # ports: ["8080:8080"]   # only if not using the tunnel

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: game
      POSTGRES_DB: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]

volumes:
  db-data:
