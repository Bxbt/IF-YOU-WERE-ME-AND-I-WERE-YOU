name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: PII scan (TC-SAFE-07)
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          if [ -z "$PII_DENYLIST" ]; then echo "PII_DENYLIST secret not set — skipping"; exit 0; fi
          printf '%s\n' "$PII_DENYLIST" > /tmp/pii.txt
          if grep -rnF -f /tmp/pii.txt --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . ; then
            echo "Found denylisted personal data"; exit 1
          fi

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
